<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beast Clicker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --accent: #22d3ee;
      --accent-2: #f59e0b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --good: #34d399;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .game {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 1rem;
    }

    .panel {
      background: color-mix(in oklab, var(--card), black 10%);
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .stat {
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 0.6rem;
    }

    .label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.2rem;
    }

    .value {
      font-size: 1.2rem;
      font-weight: 700;
    }

    #beastButton {
      width: 100%;
      border: none;
      border-radius: 16px;
      min-height: 240px;
      background: linear-gradient(160deg, #1d4ed8, #0ea5e9 58%, #22d3ee);
      color: white;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 120ms ease, filter 180ms ease;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.25;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    #beastButton:hover { filter: brightness(1.05); }
    #beastButton:active { transform: scale(0.985); }

    #beastButton .emoji {
      font-size: clamp(3rem, 9vw, 5rem);
      display: block;
      margin-bottom: 0.35rem;
    }

    .popup {
      position: absolute;
      pointer-events: none;
      font-weight: 700;
      color: var(--good);
      animation: floatUp 750ms ease-out forwards;
      text-shadow: 0 3px 10px rgba(0,0,0,0.4);
      user-select: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(0.95); opacity: 1; }
      to { transform: translateY(-38px) scale(1.05); opacity: 0; }
    }

    .shop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .muted { color: var(--muted); font-size: 0.9rem; }

    .shop {
      display: grid;
      gap: 0.55rem;
      max-height: 430px;
      overflow: auto;
      padding-right: 0.2rem;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.6rem;
      align-items: center;
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 0.6rem;
    }

    .icon { font-size: 1.35rem; }

    .name { font-weight: 650; }

    .desc {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .meta {
      font-size: 0.78rem;
      color: #93c5fd;
      margin-top: 0.18rem;
    }

    .buy {
      border: none;
      border-radius: 10px;
      background: linear-gradient(150deg, #f59e0b, #f97316);
      color: #1f2937;
      font-weight: 700;
      padding: 0.5rem 0.7rem;
      min-width: 112px;
      cursor: pointer;
      transition: filter 160ms ease, opacity 160ms ease;
    }

    .buy:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.2);
    }

    .footer {
      margin-top: 0.7rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .reset {
      background: #1f2937;
      border: 1px solid #374151;
      color: var(--danger);
      border-radius: 10px;
      padding: 0.45rem 0.7rem;
      cursor: pointer;
    }

    @media (max-width: 820px) {
      .game { grid-template-columns: 1fr; }
      #beastButton { min-height: 190px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <section class="panel">
      <h1>🐾 Beast Clicker</h1>
      <div class="stats">
        <div class="stat">
          <div class="label">Beast Bites</div>
          <div class="value" id="bites">0</div>
        </div>
        <div class="stat">
          <div class="label">Bites / Sec</div>
          <div class="value" id="bps">0</div>
        </div>
        <div class="stat">
          <div class="label">Per Click</div>
          <div class="value" id="perClick">1</div>
        </div>
        <div class="stat">
          <div class="label">Total Clicks</div>
          <div class="value" id="clicks">0</div>
        </div>
      </div>
      <button id="beastButton" aria-label="Feed beast">
        <span class="emoji">🐉</span>
        Tap the Beast to earn bites!
      </button>
      <div class="footer">
        <span class="muted">Progress auto-saves every second.</span>
        <button class="reset" id="resetBtn" type="button">Reset Save</button>
      </div>
    </section>

    <section class="panel">
      <div class="shop-header">
        <h2>Upgrades</h2>
        <span class="muted">Buy helpers to automate bite production.</span>
      </div>
      <div class="shop" id="shop"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "beast_clicker_save_v1";

    const defaultState = {
      bites: 0,
      totalClicks: 0,
      perClick: 1,
      items: {
        cub: 0,
        wolf: 0,
        chimera: 0,
        hydra: 0,
        dragon: 0,
      },
    };

    const shopItems = [
      { id: "cub", name: "Cub Scout", icon: "🐺", baseCost: 15, bps: 0.1, desc: "A tiny fang with tiny hunger." },
      { id: "wolf", name: "Dire Wolf", icon: "🦊", baseCost: 100, bps: 1, desc: "Collects scraps while you click." },
      { id: "chimera", name: "Chimera", icon: "🦁", baseCost: 1100, bps: 8, desc: "Three heads, triple appetite." },
      { id: "hydra", name: "Hydra", icon: "🐍", baseCost: 12000, bps: 47, desc: "Many mouths. Endless snacking." },
      { id: "dragon", name: "Ancient Dragon", icon: "🐉", baseCost: 130000, bps: 260, desc: "An apex feeder of legends." },
      { id: "claws", name: "Sharpened Claws", icon: "🦴", baseCost: 65, clickBoost: 1, desc: "+1 bites per click." },
      { id: "fangs", name: "Titan Fangs", icon: "⚔️", baseCost: 600, clickBoost: 4, desc: "+4 bites per click." },
      { id: "roar", name: "Primal Roar", icon: "📣", baseCost: 5500, clickBoost: 15, desc: "+15 bites per click." },
    ];

    let state = load();

    const bitesEl = document.getElementById("bites");
    const bpsEl = document.getElementById("bps");
    const perClickEl = document.getElementById("perClick");
    const clicksEl = document.getElementById("clicks");
    const beastButton = document.getElementById("beastButton");
    const shopEl = document.getElementById("shop");
    const resetBtn = document.getElementById("resetBtn");

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(defaultState),
          ...parsed,
          items: { ...defaultState.items, ...(parsed.items || {}) },
        };
      } catch {
        return structuredClone(defaultState);
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function format(n) {
      if (n < 1000) return Number(n.toFixed(1)).toString();
      const units = ["K", "M", "B", "T", "Qa", "Qi"];
      let value = n;
      let i = -1;
      while (value >= 1000 && i < units.length - 1) {
        value /= 1000;
        i++;
      }
      return `${value.toFixed(value >= 100 ? 0 : value >= 10 ? 1 : 2)}${units[i]}`;
    }

    function itemCount(id) {
      return state.items[id] || 0;
    }

    function currentCost(item) {
      const count = itemCount(item.id);
      return Math.floor(item.baseCost * Math.pow(1.15, count));
    }

    function totalBps() {
      return shopItems.reduce((sum, item) => {
        if (!item.bps) return sum;
        return sum + item.bps * itemCount(item.id);
      }, 0);
    }

    function render() {
      bitesEl.textContent = format(state.bites);
      bpsEl.textContent = format(totalBps());
      perClickEl.textContent = format(state.perClick);
      clicksEl.textContent = format(state.totalClicks);

      shopEl.innerHTML = "";
      for (const item of shopItems) {
        const count = itemCount(item.id);
        const cost = currentCost(item);
        const canBuy = state.bites >= cost;

        const row = document.createElement("article");
        row.className = "item";

        const metaLine = item.bps
          ? `${item.bps}/sec each • Owned: ${count}`
          : `+${item.clickBoost} per click • Owned: ${count}`;

        row.innerHTML = `
          <div class="icon">${item.icon}</div>
          <div>
            <div class="name">${item.name}</div>
            <div class="desc">${item.desc}</div>
            <div class="meta">${metaLine}</div>
          </div>
          <button class="buy" data-id="${item.id}" ${canBuy ? "" : "disabled"}>
            Buy ${format(cost)}
          </button>
        `;

        shopEl.appendChild(row);
      }
    }

    function gain(amount) {
      state.bites += amount;
      if (state.bites < 0) state.bites = 0;
    }

    function clickBeast(event) {
      gain(state.perClick);
      state.totalClicks += 1;

      const popup = document.createElement("span");
      popup.className = "popup";
      popup.textContent = `+${format(state.perClick)}`;
      const rect = beastButton.getBoundingClientRect();
      const x = (event?.clientX ?? rect.left + rect.width / 2) - rect.left;
      const y = (event?.clientY ?? rect.top + rect.height / 2) - rect.top;
      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;
      beastButton.appendChild(popup);
      setTimeout(() => popup.remove(), 740);

      render();
    }

    beastButton.addEventListener("click", clickBeast);

    shopEl.addEventListener("click", (event) => {
      const btn = event.target.closest("button.buy");
      if (!btn) return;
      const item = shopItems.find((x) => x.id === btn.dataset.id);
      if (!item) return;

      const cost = currentCost(item);
      if (state.bites < cost) return;

      gain(-cost);
      state.items[item.id] = itemCount(item.id) + 1;

      if (item.clickBoost) {
        state.perClick += item.clickBoost;
      }

      render();
    });

    resetBtn.addEventListener("click", () => {
      if (!confirm("Erase your progress and start from zero?")) return;
      state = structuredClone(defaultState);
      save();
      render();
    });

    setInterval(() => {
      gain(totalBps());
      render();
    }, 1000);

    setInterval(save, 1000);

    render();
  </script>
</body>
</html>
